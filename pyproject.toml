[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon"
version = "0.1.0"
description = "Future-conditioned action flow-matching policies for LIBERO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.7",
    "huggingface_hub>=0.20",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
diffusers_cosmos = [
    "diffusers>=0.34.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
